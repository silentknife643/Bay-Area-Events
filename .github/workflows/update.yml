name: Update events page
on:
  schedule: [{cron: "0 14 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - run: python build.py
        env: {TICKETMASTER_KEY: "${{ secrets.TICKETMASTER_KEY }}"}
      - run: |
          git config user.name "events-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs; git diff --cached --quiet || git commit -m "Update events"; git push
